name: Pokemon Game regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: npm test

  galar-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check full Galar storyline and completion features
        run: |
          node tests/galar-test.js
          node tests/galar-mid-test.js
          node tests/galar-finale-test.js
          node tests/galar-dlc-test.js
          node tests/galar-completion-test.js
