name: Pokemon Game regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: npm test
      - name: Audit regional map assets and traversal
        run: node tools/map-quality-audit.js

  paldea-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium for Paldea playtest
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Playtest Paldea with real Chromium
        run: node tests/browser/paldea-exploration.js
      - name: Photograph Orre, Sinnoh, Unova and Kalos maps
        run: node tests/browser/source-region-art.js
      - name: Upload source-region map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-region-map-screenshots
          path: tests/browser/out/source-regions/
          if-no-files-found: ignore
          retention-days: 7
      - name: Photograph Alola Galar and Paldea terrain
        run: node tests/browser/regional-terrain.js
      - name: Upload regional terrain screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regional-terrain-screenshots
          path: tests/browser/out/regional-terrain/
          if-no-files-found: ignore
          retention-days: 7
      - name: Playtest hand-authored multi-tile map sprites in Chromium
        run: node tests/browser/authored-region-art.js
      - name: Upload hand-authored map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authored-region-map-screenshots
          path: tests/browser/out/authored-region-art/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Paldea playtest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paldea-exploration-screenshots
          path: tests/browser/out/paldea/
          if-no-files-found: ignore
          retention-days: 7

  galar-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check full Galar storyline and completion features
        run: |
          node tests/galar-test.js
          node tests/galar-mid-test.js
          node tests/galar-finale-test.js
          node tests/galar-dlc-test.js
          node tests/galar-completion-test.js
