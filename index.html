  <main class="game">
    <!-- The 240x192 screen: the map fills all of it; a battle, a menu scene
         or the intro fill the 240x160 under its top 32 lines (FireRed's
         screen, .gba), with the text box along its bottom (only while there's
         something to read) and FireRed's windows (the Start menu) drawn over
         it. Over a scene the map still shows in the top 32 lines; over a
         battle, the battle's backdrop does (.field-sky). -->
    <div class="screen">
      <canvas id="world" class="world hidden" width="240" height="192"></canvas>
      <div id="field-sky" class="field-sky"></div>
      <!-- (The intro, the title screen and the main menu: the whole 240x192, under
           the text box. A full-screen window over everything: the Trainer Card.) -->
      <canvas id="intro" class="intro hidden" width="480" height="384"></canvas>
      <div class="gba">
      <div id="scene" class="scene"></div>
      <div id="world-pic" class="world-pic hidden"><img alt=""></div>
      <div id="field" class="field hidden">
        <div class="terrain base"></div>
        <div class="terrain foe"></div>
        <div class="terrain player"></div>
        <img id="sprite-foe" class="sprite foe hidden" alt="">
        <img id="sprite-player" class="sprite player hidden" alt="">
        <img id="ball" class="ball hidden" alt="">
      </div>
      <canvas id="overlay" class="overlay hidden" width="480" height="320"></canvas>
      <div id="textbox" class="textbox empty" aria-live="polite"></div>
      <!-- (The choices, typed names and the card tables' windows: on the screen, over the text box's corner;
           only there while something's asked.) -->
      <div id="menu" class="menu"></div>
      </div>
      <canvas id="overlay-full" class="overlay-full hidden" width="480" height="384"></canvas>
    </div>
  </main>
  <input type="file" id="file-input" accept=".json,application/json" hidden>
