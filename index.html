<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Game</title>
  <link rel="stylesheet" href="ui/battle-screen.css">
</head>
<body>
  <main class="game">
    <div class="field">
      <div class="platform foe"></div>
      <div class="platform player"></div>
      <img id="sprite-foe" class="sprite foe hidden" alt="">
      <img id="sprite-player" class="sprite player hidden" alt="">

      <div id="info-foe" class="info foe hidden">
        <div class="info-top"><span class="info-name"></span><span class="status"></span><span class="info-level"></span></div>
        <div class="hp-row">HP<div class="hp-track"><div class="hp-fill"></div></div></div>
      </div>
      <div id="info-player" class="info player hidden">
        <div class="info-top"><span class="info-name"></span><span class="status"></span><span class="info-level"></span></div>
        <div class="hp-row">HP<div class="hp-track"><div class="hp-fill"></div></div></div>
        <div class="hp-text"></div>
      </div>
    </div>

    <div class="panel">
      <div id="textbox" class="textbox" aria-live="polite">Loading…</div>
      <div id="menu" class="menu"></div>
    </div>
  </main>

  <!--
    Load order matters: each file assigns a global on window that later files read.
    tests/smoke-test.js loads every script below except those in ui/, so keep
    every game script here.
  -->
  <!-- Data -->
  <script src="data/type-chart.js"></script>
  <script src="data/natures.js"></script>
  <script src="data/dex.js"></script>
  <script src="data/moves.js"></script>
  <script src="data/abilities.js"></script>
  <script src="data/items.js"></script>
  <script src="data/learnsets.js"></script>
  <!-- Engine -->
  <script src="engine/stat-calculator.js"></script>
  <script src="engine/damage-calculator.js"></script>
  <script src="data/conditions.js"></script>
  <script src="data/battle-moves.js"></script>
  <script src="engine/battle.js"></script>
  <!-- Game -->
  <script src="game/random-team.js"></script>
  <script src="game/opponent-ai.js"></script>
  <!-- UI -->
  <script src="ui/battle-screen.js"></script>
</body>
</html>
