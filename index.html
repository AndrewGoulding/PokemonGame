<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Game</title>
  <link rel="stylesheet" href="ui/battle-screen.css">
  <link rel="stylesheet" href="ui/game.css">
  <link rel="stylesheet" href="ui/slot-machine.css">
</head>
<body>
  <main class="game">
    <!-- The 240x160 screen: the map, a battle, a menu scene or the intro, with
         the text box along its bottom (only while there's something to read)
         and FireRed's windows (the Start menu) drawn over it. -->
    <div class="screen">
      <div id="scene" class="scene"></div>
      <canvas id="world" class="world hidden" width="240" height="160"></canvas>
      <canvas id="intro" class="world hidden" width="480" height="320"></canvas>
      <div id="world-pic" class="world-pic hidden"><img alt=""></div>
      <div id="field" class="field hidden">
        <div class="terrain foe"></div>
        <div class="terrain player"></div>
        <img id="sprite-foe" class="sprite foe hidden" alt="">
        <img id="sprite-player" class="sprite player hidden" alt="">
        <img id="ball" class="ball hidden" alt="">
      </div>
      <canvas id="overlay" class="overlay hidden" width="480" height="320"></canvas>
      <div id="textbox" class="textbox empty" aria-live="polite"></div>
    </div>
    <div class="panel">
      <div id="menu" class="menu"></div>
    </div>
  </main>
  <input type="file" id="file-input" accept=".json,application/json" hidden>

  <!--
    Load order matters: each file assigns a global on window that later files read.
    tests/smoke-test.js loads every script below except those in ui/, so keep
    every game script here.
  -->

  <script src="data/type-chart.js"></script>
