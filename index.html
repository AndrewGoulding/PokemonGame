<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Game</title>
  <link rel="stylesheet" href="ui/battle-screen.css">
  <link rel="stylesheet" href="ui/game.css">
</head>
<body>
  <main class="game">
    <div id="scene" class="scene"></div>
    <canvas id="world" class="world hidden" width="240" height="160"></canvas>
    <canvas id="intro" class="world hidden" width="480" height="320"></canvas>
    <div id="world-pic" class="world-pic hidden"><img alt=""></div>
    <div id="field" class="field hidden">
      <div class="terrain foe"></div>
      <div class="terrain player"></div>
      <img id="sprite-foe" class="sprite foe hidden" alt="">
      <img id="sprite-player" class="sprite player hidden" alt="">
      <img id="ball" class="ball hidden" alt="">

      <div id="info-foe" class="info foe hidden">
        <div class="info-top"><span class="info-name"></span><span class="status"></span><span class="info-level"></span></div>
        <div class="hp-row">HP<div class="hp-track"><div class="hp-fill"></div></div></div>
      </div>
      <div id="info-player" class="info player hidden">
        <div class="info-top"><span class="info-name"></span><span class="status"></span><span class="info-level"></span></div>
        <div class="hp-row">HP<div class="hp-track"><div class="hp-fill"></div></div></div>
        <div class="hp-text"></div>
        <div class="exp-row hidden">EXP<div class="exp-track"><div class="exp-fill"></div></div></div>
      </div>
    </div>

    <div class="panel">
      <div id="textbox" class="textbox" aria-live="polite">Loading…</div>
      <div id="menu" class="menu"></div>
    </div>
  </main>
  <input type="file" id="file-input" accept=".json,application/json" hidden>

  <!--
    Load order matters: each file assigns a global on window that later files read.
    tests/smoke-test.js loads every script below except those in ui/, so keep
    every game script here.
  -->
  <!-- Data -->
  <script src="data/type-chart.js"></script>
  <script src="data/natures.js"></script>
  <script src="data/dex.js"></script>
  <script src="data/moves.js"></script>
  <script src="data/abilities.js"></script>
  <script src="data/items.js"></script>
  <script src="data/learnsets.js"></script>
  <script src="data/machine-learners.js"></script>
  <script src="data/evolutions.js"></script>
  <script src="data/item-sprites.js"></script>
  <script src="data/sprite-metrics.js"></script>
  <script src="data/world-maps.js"></script>
  <script src="data/town-map.js"></script>
  <script src="data/intro-text.js"></script>
  <!-- Engine -->
  <script src="engine/stat-calculator.js"></script>
  <script src="engine/experience.js"></script>
  <script src="engine/catching.js"></script>
  <script src="engine/item-use.js"></script>
  <script src="engine/damage-calculator.js"></script>
  <script src="data/conditions.js"></script>
  <script src="data/battle-moves.js"></script>
  <script src="engine/battle.js"></script>
  <!-- Game -->
  <script src="game/random-team.js"></script>
  <script src="game/opponent-ai.js"></script>
  <script src="game/party.js"></script>
  <script src="game/evolution.js"></script>
  <script src="game/encounters.js"></script>
  <script src="game/player.js"></script>
  <script src="game/bag.js"></script>
  <script src="game/save.js"></script>
  <script src="game/world.js"></script>
  <script src="game/mining.js"></script>
  <script src="game/m4a.js"></script>
  <!-- UI -->
  <script src="ui/audio.js"></script>
  <script src="ui/screen.js"></script>
  <script src="ui/gamepad.js"></script>
  <script src="ui/battle-screen.js"></script>
  <script src="ui/overworld.js"></script>
  <script src="ui/intro.js"></script>
  <script src="ui/mining.js"></script>
  <script src="ui/game.js"></script>
</body>
</html>
